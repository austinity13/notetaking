
<style>
*{box-sizing:border-box;margin:0;padding:0}
input,textarea,button,select{font-family:inherit}

.qc-app{display:flex;min-height:660px;font-size:14px;transition:background .2s,color .2s}

.qc-app.dark{--bg0:#18181b;--bg1:#1f1f23;--bg2:#27272b;--bg3:#303034;--border:#3a3a40;--border2:#4a4a52;--txt:#f4f4f5;--txt2:#a1a1aa;--txt3:#71717a;--blue-bg:#1e3a5f;--blue-border:#2563eb;--blue-txt:#93c5fd;--green-bg:#14532d;--green-border:#16a34a;--green-txt:#86efac;--red-bg:#450a0a;--red-border:#dc2626;--red-txt:#fca5a5}
.qc-app.light{--bg0:#ffffff;--bg1:#f9f9fb;--bg2:#f3f3f6;--bg3:#ebebf0;--border:#e4e4e9;--border2:#d0d0d8;--txt:#18181b;--txt2:#52525b;--txt3:#a1a1aa;--blue-bg:#eff6ff;--blue-border:#3b82f6;--blue-txt:#1d4ed8;--green-bg:#f0fdf4;--green-border:#22c55e;--green-txt:#15803d;--red-bg:#fef2f2;--red-border:#ef4444;--red-txt:#dc2626}

.qc-app{background:var(--bg1);color:var(--txt)}

.sidebar{width:216px;flex-shrink:0;border-right:0.5px solid var(--border);display:flex;flex-direction:column;background:var(--bg0)}
.sidebar-top{padding:14px 12px 10px;border-bottom:0.5px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.brand-icon{width:28px;height:28px;background:#2563eb;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--txt)}
.new-btn{width:100%;padding:6px 10px;border-radius:7px;border:0.5px dashed var(--border2);background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--txt2);display:flex;align-items:center;gap:6px;transition:background .12s}
.new-btn:hover{background:var(--bg2);color:var(--txt)}
.quiz-list{flex:1;overflow-y:auto;padding:6px 8px}
.qz-item{padding:7px 9px;border-radius:8px;cursor:pointer;margin-bottom:2px;display:flex;align-items:center;gap:4px;transition:background .1s}
.qz-item:hover{background:var(--bg2)}
.qz-item.active{background:var(--blue-bg)}
.qz-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.qz-item.active .qz-name{color:var(--blue-txt)}
.qz-cnt{font-size:11px;color:var(--txt3);flex-shrink:0}
.qz-del{width:20px;height:20px;border:none;background:transparent;cursor:pointer;border-radius:4px;display:none;align-items:center;justify-content:center;color:var(--txt3);flex-shrink:0}
.qz-item:hover .qz-del{display:flex}
.qz-del:hover{color:var(--red-txt);background:var(--red-bg)}
.sidebar-foot{padding:8px;border-top:0.5px solid var(--border)}
.sec-label{padding:7px 4px 4px;font-size:10px;font-weight:500;color:var(--txt3);letter-spacing:.6px;text-transform:uppercase}
.nav-item{padding:7px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--txt2);transition:background .1s}
.nav-item:hover{background:var(--bg2);color:var(--txt)}
.nav-item.active{background:var(--blue-bg);color:var(--blue-txt)}
.theme-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;margin-top:2px}
.theme-label{font-size:12px;color:var(--txt2)}
.theme-toggle{display:flex;background:var(--bg2);border-radius:6px;padding:2px;border:0.5px solid var(--border);gap:2px}
.theme-btn{padding:3px 8px;border-radius:4px;border:none;background:transparent;cursor:pointer;font-size:11px;font-weight:500;color:var(--txt3);transition:all .12s}
.theme-btn.active{background:var(--bg0);color:var(--txt);border:0.5px solid var(--border)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg1)}
.topbar{padding:11px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg0)}
.title-inp{font-size:15px;font-weight:600;border:none;outline:none;background:transparent;color:var(--txt);letter-spacing:-0.2px;flex:1;min-width:0}
.title-inp::placeholder{color:var(--txt3)}
.cnt-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg2);border:0.5px solid var(--border);color:var(--txt2);white-space:nowrap}
.topbar-btns{display:flex;gap:5px;align-items:center;margin-left:auto}
.btn{padding:6px 11px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--txt);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .1s;white-space:nowrap}
.btn:hover{background:var(--bg3)}
.btn-p{background:#2563eb;border-color:#2563eb;color:#fff}
.btn-p:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn:disabled{opacity:.4;cursor:default}

.tab-bar{display:flex;gap:0;border-bottom:0.5px solid var(--border);background:var(--bg0)}
.tab{padding:8px 16px;border:none;background:transparent;color:var(--txt2);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:color .12s}
.tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
.tab:hover:not(.active){color:var(--txt)}

.content{flex:1;padding:18px;overflow-y:auto}

.empty-qs{text-align:center;padding:3rem 1rem;color:var(--txt2)}
.empty-icon{width:44px;height:44px;border-radius:10px;border:1.5px dashed var(--border2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}

.q-card{background:var(--bg0);border:0.5px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;transition:border-color .15s}
.q-card:hover{border-color:var(--border2)}
.q-header{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.q-num{font-size:10px;font-weight:600;background:var(--bg2);border:0.5px solid var(--border);border-radius:5px;padding:2px 6px;color:var(--txt2);letter-spacing:.4px;text-transform:uppercase;flex-shrink:0}
.q-inp{flex:1;padding:6px 9px;border-radius:7px;border:0.5px solid var(--border);background:var(--bg2);color:var(--txt);font-size:13px;font-weight:500;outline:none}
.q-inp:focus{border-color:var(--blue-border);background:var(--bg1)}
.q-inp::placeholder{color:var(--txt3)}
.icon-btn{width:27px;height:27px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:all .1s;flex-shrink:0}
.icon-btn:hover{background:var(--bg3);color:var(--txt)}
.icon-btn.danger:hover{background:var(--red-bg);border-color:var(--red-border);color:var(--red-txt)}

.opt-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.opt-circle{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.opt-circle.correct{background:#2563eb;border-color:#2563eb}
.opt-letter{width:18px;font-size:11px;font-weight:500;color:var(--txt3);text-align:center;flex-shrink:0}
.opt-inp{flex:1;padding:5px 9px;border-radius:6px;border:0.5px solid var(--border);background:var(--bg1);color:var(--txt);font-size:13px;outline:none}
.opt-inp:focus{border-color:var(--blue-border)}
.opt-inp::placeholder{color:var(--txt3)}
.opt-inp.cbg{border-color:var(--blue-border);background:var(--blue-bg)}
.opt-inp.cbg{color:var(--blue-txt)}
.opt-rm{width:19px;height:19px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--txt3);flex-shrink:0}
.opt-rm:hover{background:var(--red-bg);color:var(--red-txt)}
.q-foot{display:flex;align-items:center;gap:7px;margin-top:7px}
.add-opt{padding:4px 9px;border-radius:6px;border:0.5px dashed var(--border2);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;transition:background .1s}
.add-opt:hover{background:var(--bg2);color:var(--txt)}
.type-pill{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg2);border:0.5px solid var(--border);color:var(--txt2)}

.pv-start{text-align:center;padding:2.5rem 1rem}
.pv-icon{width:54px;height:54px;border-radius:14px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.prog-bar{height:3px;background:var(--bg3);border-radius:2px;margin-bottom:14px;overflow:hidden}
.prog-fill{height:100%;background:#2563eb;border-radius:2px;transition:width .3s}
.ans-btn{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg0);cursor:pointer;margin-bottom:7px;transition:all .12s;color:var(--txt);font-size:13px}
.ans-btn:hover{border-color:var(--blue-border);background:var(--blue-bg)}
.ans-btn.sel{border-color:var(--blue-border);background:var(--blue-bg);color:var(--blue-txt)}
.ans-btn.ok{border-color:var(--green-border);background:var(--green-bg);color:var(--green-txt)}
.ans-btn.wrong{border-color:var(--red-border);background:var(--red-bg);color:var(--red-txt)}
.ans-lbl{width:24px;height:24px;border-radius:6px;background:var(--bg2);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--txt2)}
.sel .ans-lbl{background:#2563eb;color:#fff}
.ok .ans-lbl{background:#16a34a;color:#fff}
.wrong .ans-lbl{background:#dc2626;color:#fff}

.res-ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px;font-weight:600}
.review-item{padding:8px 0;border-bottom:0.5px solid var(--border)}

.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.note-card{background:var(--bg0);border:0.5px solid var(--border);border-radius:10px;padding:11px 13px}
.note-title{font-size:13px;font-weight:500;border:none;outline:none;background:transparent;color:var(--txt);width:calc(100% - 24px);margin-bottom:5px}
.note-title::placeholder{color:var(--txt3)}
.note-body{font-size:12px;border:none;outline:none;background:transparent;color:var(--txt2);width:100%;resize:none;line-height:1.6;min-height:60px}
.note-body::placeholder{color:var(--txt3)}
.note-del{width:20px;height:20px;border:none;background:transparent;cursor:pointer;border-radius:4px;color:var(--txt3);display:flex;align-items:center;justify-content:center;float:right}
.note-del:hover{color:var(--red-txt);background:var(--red-bg)}

.home-center{text-align:center;padding:60px 20px;color:var(--txt2)}
.home-icon{width:52px;height:52px;border-radius:14px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
</style>

<h2 style="position:absolute;left:-9999px">QuizCraft — multi-quiz builder with dark mode and session persistence</h2>

<div class="qc-app light" id="app">
 <div class="sidebar">
  <div class="sidebar-top">
   <div class="brand">
    <div class="brand-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
    <span class="brand-name">QuizCraft</span>
   </div>
   <button class="new-btn" onclick="newQuiz()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New quiz</button>
  </div>
  <div class="quiz-list" id="quiz-list"></div>
  <div class="sidebar-foot">
   <div class="sec-label">Tools</div>
   <div class="nav-item" id="nav-notes" onclick="openNotes()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Notes
   </div>
   <div class="theme-row">
    <span class="theme-label">Theme</span>
    <div class="theme-toggle">
     <button class="theme-btn active" id="btn-light" onclick="setTheme('light')">Light</button>
     <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">Dark</button>
    </div>
   </div>
  </div>
 </div>
 <div class="main" id="main-panel">
  <div id="home-view" class="home-center">
   <div class="home-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
   <p style="font-size:15px;font-weight:500;color:var(--txt);margin-bottom:6px">Welcome to QuizCraft</p>
   <p style="font-size:13px;margin-bottom:20px">Create a quiz from the sidebar to get started</p>
   <button class="btn btn-p" onclick="newQuiz()" style="margin:0 auto;display:inline-flex"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New quiz</button>
  </div>
  <div id="quiz-view" style="display:none;flex-direction:column;flex:1"></div>
  <div id="notes-view" style="display:none;flex-direction:column;flex:1"></div>
 </div>
</div>

<script>
const STORE_KEY='qc_data_v2';
let state={quizzes:[],notes:[],nextQzId:1,nextQId:1,nextNId:1};
let activeQuizId=null,activeView='home',activeTab='builder',theme='light';
let quizState={started:false,done:false,currentQ:0,score:0,answers:[]};

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const d=JSON.parse(raw);Object.assign(state,d);theme=d.theme||'light';}
    else{
      state={quizzes:[
        {id:1,title:'Geography basics',questions:[
          {id:1,text:'What is the capital of France?',options:['London','Paris','Berlin','Madrid'],correct:1},
          {id:2,text:'Which is the largest ocean?',options:['Atlantic','Indian','Pacific','Arctic'],correct:2}
        ]},
        {id:2,title:'Science quick-fire',questions:[
          {id:1,text:'True or false: the sun is a planet.',options:['True','False'],correct:1},
          {id:2,text:'What gas do plants absorb?',options:['Oxygen','Nitrogen','Carbon dioxide','Hydrogen'],correct:2}
        ]}
      ],notes:[{id:1,title:'Study tips',body:'Review chapters 3–5 before the exam.'}],nextQzId:3,nextQId:10,nextNId:2,theme:'light'};
      save();
    }
  }catch(e){console.warn('load error',e);}
  setTheme(theme,true);
}

function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({...state,theme}));}catch(e){}
}

function setTheme(t,init){
  theme=t;
  const app=document.getElementById('app');
  app.classList.toggle('dark',t==='dark');
  app.classList.toggle('light',t==='light');
  document.getElementById('btn-light').classList.toggle('active',t==='light');
  document.getElementById('btn-dark').classList.toggle('active',t==='dark');
  if(!init)save();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function $(i){return document.getElementById(i);}
function getQuiz(){return state.quizzes.find(q=>q.id===activeQuizId);}

function renderSidebar(){
  $('quiz-list').innerHTML=state.quizzes.map(qz=>`
   <div class="qz-item${activeQuizId===qz.id?' active':''}" onclick="openQuiz(${qz.id})">
    <span class="qz-name">${esc(qz.title)}</span>
    <span class="qz-cnt">${qz.questions.length}</span>
    <button class="qz-del" onclick="event.stopPropagation();deleteQuiz(${qz.id})" title="Delete quiz">
     <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
   </div>`).join('');
  $('nav-notes').className='nav-item'+(activeView==='notes'?' active':'');
}

function showView(name){
  $('home-view').style.display=name==='home'?'block':'none';
  $('quiz-view').style.display=name==='quiz'?'flex':'none';
  $('notes-view').style.display=name==='notes'?'flex':'none';
  activeView=name;renderSidebar();
}

function newQuiz(){
  const qz={id:state.nextQzId++,title:'Untitled quiz',questions:[]};
  state.quizzes.push(qz);save();openQuiz(qz.id);
}

function deleteQuiz(id){
  state.quizzes=state.quizzes.filter(q=>q.id!==id);save();
  if(activeQuizId===id){activeQuizId=null;showView('home');}
  else renderSidebar();
}

function openQuiz(id){
  activeQuizId=id;activeTab='builder';
  quizState={started:false,done:false,currentQ:0,score:0,answers:[]};
  showView('quiz');renderQuizView();
}

function renderQuizView(){
  const qz=getQuiz();if(!qz)return;
  $('quiz-view').innerHTML=`
   <div class="topbar">
    <input class="title-inp" id="qtitle" value="${esc(qz.title)}" placeholder="Quiz title…" oninput="updateTitle(this.value)" style="max-width:260px">
    <span class="cnt-badge" id="qbadge">${qz.questions.length} question${qz.questions.length!==1?'s':''}</span>
    <div class="topbar-btns">
     <button class="btn" onclick="exportQuiz()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export</button>
     <button class="btn" onclick="importJSON()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Import</button>
     <button class="btn btn-p" onclick="addQuestion()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add question</button>
    </div>
   </div>
   <div class="tab-bar">
    <button class="tab${activeTab==='builder'?' active':''}" onclick="switchTab('builder')">Builder</button>
    <button class="tab${activeTab==='preview'?' active':''}" onclick="switchTab('preview')">Preview</button>
   </div>
   <div class="content" id="tcontent"></div>`;
  renderTab();
}

function switchTab(t){activeTab=t;quizState={started:false,done:false,currentQ:0,score:0,answers:[]};renderQuizView();}
function updateTitle(v){const qz=getQuiz();if(!qz)return;qz.title=v;save();renderSidebar();const b=$('qbadge');if(b)b.textContent=qz.questions.length+' question'+(qz.questions.length!==1?'s':'');}
function renderTab(){if(activeTab==='builder')renderBuilder();else renderPreview();}

function renderBuilder(){
  const qz=getQuiz();const c=$('tcontent');if(!qz||!c)return;
  if(qz.questions.length===0){
    c.innerHTML=`<div class="empty-qs"><div class="empty-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><p style="font-weight:500;color:var(--txt);margin-bottom:4px">No questions yet</p><p style="font-size:12px">Click "Add question" to begin</p></div>`;return;
  }
  const L=['A','B','C','D','E','F'];
  c.innerHTML=qz.questions.map((q,qi)=>{
    const lbl=q.options.length===2?'True / False':q.options.length+'-option';
    return`<div class="q-card">
     <div class="q-header">
      <span class="q-num">Q${qi+1}</span>
      <input class="q-inp" value="${esc(q.text)}" placeholder="Type your question…" oninput="updateQText(${q.id},this.value)">
      <div style="display:flex;gap:4px">
       ${qi>0?`<button class="icon-btn" onclick="moveQ(${q.id},-1)" title="Move up"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg></button>`:''}
       ${qi<qz.questions.length-1?`<button class="icon-btn" onclick="moveQ(${q.id},1)" title="Move down"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></button>`:''}
       <button class="icon-btn danger" onclick="removeQ(${q.id})" title="Delete"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
      </div>
     </div>
     ${q.options.map((opt,oi)=>`
      <div class="opt-row">
       <button class="opt-circle${q.correct===oi?' correct':''}" onclick="setCorrect(${q.id},${oi})" title="Mark as correct answer">
        ${q.correct===oi?`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}
       </button>
       <span class="opt-letter">${L[oi]}</span>
       <input class="opt-inp${q.correct===oi?' cbg':''}" value="${esc(opt)}" placeholder="Option ${L[oi]}…" oninput="updateOpt(${q.id},${oi},this.value)">
       ${q.options.length>2?`<button class="opt-rm" onclick="removeOpt(${q.id},${oi})" title="Remove option"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`:`<div style="width:19px"></div>`}
      </div>`).join('')}
     <div class="q-foot">
      ${q.options.length<6?`<button class="add-opt" onclick="addOpt(${q.id})">+ Add option</button>`:''}
      <span class="type-pill">${lbl}</span>
     </div>
    </div>`;
  }).join('');
}

function addQuestion(){const qz=getQuiz();if(!qz)return;qz.questions.push({id:state.nextQId++,text:'',options:['',''],correct:0});save();renderQuizView();refreshBadge();}
function removeQ(id){const qz=getQuiz();if(!qz)return;qz.questions=qz.questions.filter(q=>q.id!==id);save();renderQuizView();refreshBadge();}
function moveQ(id,dir){const qz=getQuiz();if(!qz)return;const i=qz.questions.findIndex(q=>q.id===id);const ni=i+dir;if(ni<0||ni>=qz.questions.length)return;[qz.questions[i],qz.questions[ni]]=[qz.questions[ni],qz.questions[i]];save();renderBuilder();}
function updateQText(id,v){const qz=getQuiz();if(!qz)return;const q=qz.questions.find(q=>q.id===id);if(q){q.text=v;save();}}
function updateOpt(qid,oi,v){const qz=getQuiz();if(!qz)return;const q=qz.questions.find(q=>q.id===qid);if(q){q.options[oi]=v;save();}}
function setCorrect(qid,oi){const qz=getQuiz();if(!qz)return;const q=qz.questions.find(q=>q.id===qid);if(q){q.correct=oi;save();renderBuilder();}}
function addOpt(qid){const qz=getQuiz();if(!qz)return;const q=qz.questions.find(q=>q.id===qid);if(q&&q.options.length<6){q.options.push('');save();renderBuilder();}}
function removeOpt(qid,oi){const qz=getQuiz();if(!qz)return;const q=qz.questions.find(q=>q.id===qid);if(q&&q.options.length>2){q.options.splice(oi,1);if(q.correct>=q.options.length)q.correct=0;save();renderBuilder();}}
function refreshBadge(){const qz=getQuiz();const b=$('qbadge');if(b&&qz)b.textContent=qz.questions.length+' question'+(qz.questions.length!==1?'s':'');renderSidebar();}

function renderPreview(){
  const qz=getQuiz();const c=$('tcontent');if(!qz||!c)return;
  if(!qz.questions.length){c.innerHTML=`<div class="empty-qs"><p style="font-size:13px">No questions to preview. Add some in the builder.</p></div>`;return;}
  if(!quizState.started){
    c.innerHTML=`<div class="pv-start">
     <div class="pv-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
     <p style="font-size:16px;font-weight:600;margin-bottom:6px;color:var(--txt)">${esc(qz.title)}</p>
     <p style="color:var(--txt2);font-size:13px;margin-bottom:20px">${qz.questions.length} question${qz.questions.length!==1?'s':''}</p>
     <button class="btn btn-p" onclick="startQuiz()" style="margin:0 auto;display:inline-flex;padding:8px 24px">Start quiz</button>
    </div>`;return;
  }
  if(quizState.done){renderResults();return;}
  renderQuestion();
}

function startQuiz(){quizState={started:true,done:false,currentQ:0,score:0,answers:new Array(getQuiz().questions.length).fill(null)};renderTab();}

function renderQuestion(){
  const qz=getQuiz();const c=$('tcontent');if(!qz||!c)return;
  const qi=quizState.currentQ;const q=qz.questions[qi];const sel=quizState.answers[qi];
  const pct=Math.round((qi/qz.questions.length)*100);
  const L=['A','B','C','D','E','F'];
  c.innerHTML=`<div style="max-width:500px;margin:0 auto;padding-top:4px">
   <div style="display:flex;justify-content:space-between;margin-bottom:8px">
    <span style="font-size:12px;color:var(--txt2)">Question ${qi+1} of ${qz.questions.length}</span>
    <span style="font-size:12px;color:var(--txt2)">Score: ${quizState.score}/${qi}</span>
   </div>
   <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
   <p style="font-size:15px;font-weight:500;margin-bottom:14px;line-height:1.5;color:var(--txt)">${esc(q.text)||'(No question text)'}</p>
   ${q.options.map((opt,oi)=>`
    <button class="ans-btn${sel===oi?' sel':''}" onclick="selectAns(${oi})">
     <span class="ans-lbl">${L[oi]}</span>${esc(opt)||'(empty)'}
    </button>`).join('')}
   <div style="display:flex;gap:8px;margin-top:14px">
    ${qi>0?`<button class="btn" onclick="prevQ()">← Back</button>`:''}
    <button class="btn btn-p" onclick="nextQ()" ${sel===null?'disabled':''} style="margin-left:auto">${qi===qz.questions.length-1?'Finish':'Next →'}</button>
   </div>
  </div>`;
}

function selectAns(oi){quizState.answers[quizState.currentQ]=oi;renderQuestion();}
function prevQ(){quizState.currentQ--;renderQuestion();}
function nextQ(){
  const qz=getQuiz();const qi=quizState.currentQ;
  if(quizState.answers[qi]===qz.questions[qi].correct)quizState.score++;
  if(qi<qz.questions.length-1){quizState.currentQ++;renderQuestion();}
  else{quizState.done=true;renderResults();}
}

function renderResults(){
  const qz=getQuiz();const c=$('tcontent');if(!qz||!c)return;
  const pct=Math.round((quizState.score/qz.questions.length)*100);
  const isGood=pct>=80,isMid=pct>=60;
  const ringBg=isGood?'var(--green-bg)':isMid?'#422006':'var(--red-bg)';
  const ringCol=isGood?'var(--green-txt)':isMid?'#fbbf24':'var(--red-txt)';
  const msg=isGood?'Excellent work!':isMid?'Good effort!':'Keep practicing!';
  const L=['A','B','C','D','E','F'];
  const review=qz.questions.map((q,qi)=>{
    const ua=quizState.answers[qi];const ok=ua===q.correct;
    return`<div class="review-item">
     <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:3px">
      <span style="font-size:11px;padding:1px 6px;border-radius:4px;background:${ok?'var(--green-bg)':'var(--red-bg)'};color:${ok?'var(--green-txt)':'var(--red-txt)'};font-weight:500;flex-shrink:0">${ok?'✓':'✗'}</span>
      <span style="font-size:13px;font-weight:500;color:var(--txt)">${esc(q.text)||'(No text)'}</span>
     </div>
     <div style="padding-left:28px;font-size:12px;color:var(--txt2)">
      Your answer: <span style="color:${ok?'var(--green-txt)':'var(--red-txt)'}">${ua!==null?esc(q.options[ua])||'(empty)':'Skipped'}</span>
      ${!ok?` · Correct: <span style="color:var(--green-txt)">${esc(q.options[q.correct])||'(empty)'}</span>`:''}
     </div>
    </div>`;}).join('');
  c.innerHTML=`<div style="max-width:500px;margin:0 auto;padding-top:4px">
   <div style="text-align:center;margin-bottom:18px">
    <div class="res-ring" style="background:${ringBg};color:${ringCol}">${pct}%</div>
    <p style="font-weight:600;font-size:16px;margin-bottom:4px;color:var(--txt)">${msg}</p>
    <p style="color:var(--txt2);font-size:13px">${quizState.score} of ${qz.questions.length} correct</p>
   </div>
   <div style="background:var(--bg2);border-radius:10px;padding:11px 14px;margin-bottom:14px">
    <p style="font-size:10px;font-weight:600;color:var(--txt3);margin-bottom:8px;letter-spacing:.6px;text-transform:uppercase">Review</p>
    ${review}
   </div>
   <div style="text-align:center">
    <button class="btn btn-p" onclick="startQuiz()" style="display:inline-flex;margin:0 auto;padding:8px 24px">Retake quiz</button>
   </div>
  </div>`;
}

function openNotes(){activeQuizId=null;showView('notes');renderNotesView();}
function renderNotesView(){
  $('notes-view').innerHTML=`
   <div class="topbar">
    <span style="font-size:15px;font-weight:600;color:var(--txt)">Study notes</span>
    <button class="btn btn-p" onclick="addNote()" style="margin-left:auto"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add note</button>
   </div>
   <div class="content"><div class="notes-grid" id="ngrid"></div></div>`;
  renderNotes();
}
function renderNotes(){
  const g=$('ngrid');if(!g)return;
  if(!state.notes.length){g.innerHTML=`<p style="color:var(--txt2);font-size:13px;grid-column:1/-1;text-align:center;padding:2rem">No notes yet.</p>`;return;}
  g.innerHTML=state.notes.map(n=>`
   <div class="note-card">
    <button class="note-del" onclick="deleteNote(${n.id})"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <input class="note-title" value="${esc(n.title)}" placeholder="Title…" oninput="updateNote(${n.id},'title',this.value)">
    <textarea class="note-body" placeholder="Write your notes…" oninput="updateNote(${n.id},'body',this.value)">${esc(n.body)}</textarea>
   </div>`).join('');
}
function addNote(){state.notes.push({id:state.nextNId++,title:'New note',body:''});save();renderNotes();}
function deleteNote(id){state.notes=state.notes.filter(n=>n.id!==id);save();renderNotes();}
function updateNote(id,f,v){const n=state.notes.find(n=>n.id===id);if(n){n[f]=v;save();}}

function exportQuiz(){
  const qz=getQuiz();if(!qz)return;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({title:qz.title,questions:qz.questions},null,2)],{type:'application/json'}));a.download=(qz.title||'quiz').replace(/\s+/g,'_')+'.json';a.click();
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);const qz=getQuiz();if(!qz)return;
        if(d.title)qz.title=d.title;
        if(Array.isArray(d.questions))qz.questions=d.questions;
        state.nextQId=Math.max(...qz.questions.map(q=>q.id||0),state.nextQId)+1;
        save();renderQuizView();refreshBadge();
      }catch{alert('Invalid JSON file.');}
    };r.readAsText(file);
  };inp.click();
}

load();renderSidebar();
</script>
